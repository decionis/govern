# The name is the Marketplace listing's, kept so its address stays
# github.com/marketplace/actions/decionis-action-gate.
name: "Decionis Action Gate"
author: "Decionis"
description: "Govern: one Decionis verdict before a workflow step runs — a deploy, a migration, an infrastructure change, an agent's action — with a signed Decision Dossier of it."

branding:
  icon: "shield"
  color: "purple"

# This is the Marketplace address of Govern. The gate itself lives in
# decionis/agent-safe-pipeline under govern/, the reference implementation of
# the Decionis execution contract; this action carries the listing's metadata
# and delegates every input and output to that action at a pinned commit.
# The pinned action downloads the release binary its commit names and
# verifies it before running, or builds the same bytes from the commit when
# no archive exists yet. To move to a newer gate, move the pin.

inputs:
  api-key:
    description: >-
      Decionis API key for the workspace. Pass a secret (`secrets.DECIONIS_API_KEY`); never write it in the workflow — GitHub evaluates an expression even inside this description.
    required: false
    default: ""
  tenant-id:
    description: >-
      The workspace (organization) the key belongs to, a UUID. Not a secret, but a repository variable keeps it in one place.
    required: false
    default: ""
  mode:
    description: >-
      `enforce` (default): the command runs only on an ALLOW whose grant this step claimed. `shadow`: the command starts at once, the verdict is recorded beside it, and the step never fails for the gate's sake.
    required: false
    default: "enforce"
  action:
    description: >-
      The action's type as the record names it, e.g. `production-deploy`, `terraform-apply`, `database-migration` (lowercase, `[a-z][a-z0-9._:-]*`).
    required: false
    default: "workflow.step"
  resource:
    description: >-
      What the action acts on, e.g. `service:api` or `env:production`. Default: the command.
    required: false
    default: ""
  payload:
    description: >-
      A JSON object describing the action: the parameters the record keeps and policy reads (`{"service":"api","replicas":3}`).
    required: false
    default: ""
  environment:
    description: >-
      The deployment environment the action lands in, e.g. `production`.
    required: false
    default: ""
  run:
    description: >-
      The command to gate. It runs through this step, so it cannot run without an authorizing verdict; there is no `if:` to delete.
    required: false
    default: ""
  shell:
    description: >-
      `bash` (default) or `sh`.
    required: false
    default: "bash"
  fail-on:
    description: >-
      For a step without `run`: which verdicts fail it. `block` (default), `escalate`, `block_or_escalate`, `never`.
    required: false
    default: "block"
  escalation:
    description: >-
      `managed`: on an ESCALATE, Decionis orchestrates the approval and the step holds for it, at most until the intent expires (five minutes). `none` (default): an ESCALATE ends the step like `fail-on` says.
    required: false
    default: "none"
  approver:
    description: >-
      The principal who approves a managed escalation.
    required: false
    default: ""
  approver-role:
    description: >-
      Or the role that does, e.g. `RELEASE_MANAGER`.
    required: false
    default: ""
  policy-file:
    description: >-
      The repository's policy file, whose path and SHA-256 travel in the intent so the dossier records the exact revision. Default `DECIONIS_POLICY.md` (`.yaml`/`.yml` siblings are tried); `""` disables.
    required: false
    default: "DECIONIS_POLICY.md"
  comment:
    description: >-
      `true`: post (and update in place) the verdict on the pull request. Needs `pull-requests: write`.
    required: false
    default: "false"
  show-attribution:
    description: >-
      `false` drops the footer from the comment.
    required: false
    default: "true"
  api-url:
    description: >-
      The Decionis API base URL (https), for self-hosting.
    required: false
    default: "https://api.decionis.com"
  timeout:
    description: >-
      Per authority call, e.g. `20s`.
    required: false
    default: "20s"
  intent-ttl:
    description: >-
      How long the intent stays decidable; at most `5m`.
    required: false
    default: "5m"
  report:
    description: >-
      Where to write the JSON record of the run; empty for none.
    required: false
    default: ""

outputs:
  decision:
    description: >-
      `ALLOW`, `ESCALATE` or `BLOCK`; empty when the authority was not asked.
    value: ${{ steps.gate.outputs.decision }}
  decision-id:
    description: >-
      The authority's decision id.
    value: ${{ steps.gate.outputs.decision-id }}
  dossier-id:
    description: >-
      The signed Decision Dossier's id.
    value: ${{ steps.gate.outputs.dossier-id }}
  dossier-url:
    description: >-
      The authenticated path of the dossier.
    value: ${{ steps.gate.outputs.dossier-url }}
  verify-url:
    description: >-
      A page anyone can open to verify the decision, when the authority attached one.
    value: ${{ steps.gate.outputs.verify-url }}
  intent-id:
    description: >-
      The intent's id (the grant issuance boundary).
    value: ${{ steps.gate.outputs.intent-id }}
  intent-hash:
    description: >-
      The canonical intent's SHA-256, what every record names.
    value: ${{ steps.gate.outputs.intent-hash }}
  reason-codes:
    description: >-
      The authority's reason codes, comma separated.
    value: ${{ steps.gate.outputs.reason-codes }}
  policy-version:
    description: >-
      The policy version the decision was made under.
    value: ${{ steps.gate.outputs.policy-version }}
  policy-sha256:
    description: >-
      The SHA-256 of the repository policy file the intent carried.
    value: ${{ steps.gate.outputs.policy-sha256 }}
  policy-path:
    description: >-
      Its path.
    value: ${{ steps.gate.outputs.policy-path }}
  mode:
    description: >-
      `SHADOW` or `ENFORCEMENT`.
    value: ${{ steps.gate.outputs.mode }}
  fail-closed:
    description: >-
      `true` when no authoritative decision was reached and the gate refused.
    value: ${{ steps.gate.outputs.fail-closed }}
  executed:
    description: >-
      `true` when the command ran, `false` when it did not; empty without a command.
    value: ${{ steps.gate.outputs.executed }}
  claimed:
    description: >-
      `true` when a grant was claimed for the run.
    value: ${{ steps.gate.outputs.claimed }}
  exit-code:
    description: >-
      The command's exit code.
    value: ${{ steps.gate.outputs.exit-code }}
  outcome:
    description: >-
      `COMMITTED`, `FAILED` or `INDETERMINATE`, as finalized with the authority.
    value: ${{ steps.gate.outputs.outcome }}
  finalization:
    description: >-
      `RECORDED` when the authority recorded the outcome, `PENDING` when it did not.
    value: ${{ steps.gate.outputs.finalization }}
  badge-markdown:
    description: >-
      A “Governed by Decionis” badge, linking to the proof.
    value: ${{ steps.gate.outputs.badge-markdown }}

runs:
  using: "composite"
  steps:
    - name: Govern the step
      id: gate
      uses: decionis/agent-safe-pipeline/govern@a29fb021cf3fd8dd031aa66f4f841bfa0ecb6c71 # master, 2026-09-21 (#245)
      with:
        api-key: ${{ inputs.api-key }}
        tenant-id: ${{ inputs.tenant-id }}
        mode: ${{ inputs.mode }}
        action: ${{ inputs.action }}
        resource: ${{ inputs.resource }}
        payload: ${{ inputs.payload }}
        environment: ${{ inputs.environment }}
        run: ${{ inputs.run }}
        shell: ${{ inputs.shell }}
        fail-on: ${{ inputs.fail-on }}
        escalation: ${{ inputs.escalation }}
        approver: ${{ inputs.approver }}
        approver-role: ${{ inputs.approver-role }}
        policy-file: ${{ inputs.policy-file }}
        comment: ${{ inputs.comment }}
        show-attribution: ${{ inputs.show-attribution }}
        api-url: ${{ inputs.api-url }}
        timeout: ${{ inputs.timeout }}
        intent-ttl: ${{ inputs.intent-ttl }}
        report: ${{ inputs.report }}
